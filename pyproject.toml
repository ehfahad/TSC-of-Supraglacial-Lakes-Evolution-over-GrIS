[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpsgmm"
version = "1.0.0"
description = "Time series classification of supraglacial lake evolution with Gaussian Mixture Models of Reconstructed Phase Spaces"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Emam Hossain", email = "emamh1@umbc.edu" },
    { name = "Md Osman Gani", email = "mogani@umbc.edu" },
    { name = "Devon Dunmire", email = "devon.dunmire@kuleuven.be" },
    { name = "Aneesh C. Subramanian", email = "aneeshcs@colorado.edu" },
    { name = "Hammad Younas", email = "hammadyounas27@icloud.com" },
]
keywords = [
    "time series classification",
    "reconstructed phase space",
    "gaussian mixture model",
    "supraglacial lakes",
    "greenland ice sheet",
    "remote sensing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# numpy, scipy and scikit-learn are pinned: GaussianMixture depends on k-means
# initialization, whose behavior has changed across scikit-learn releases.
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.0",
    "scikit-learn==1.4.2",
    "pandas>=2.0,<3.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
preprocessing = ["xarray>=2023.6", "netCDF4>=1.6", "geopandas>=0.13", "requests>=2.31"]
baselines = ["sktime==0.30.1", "tensorflow>=2.13,<2.16", "dtaidistance>=2.3"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.25"]

[project.urls]
Repository = "https://github.com/ehfahad/TSC-of-Supraglacial-Lakes-Evolution-over-GrIS"
Paper = "https://doi.org/10.1109/ICMLA61862.2024.00072"
Dataset = "https://doi.org/10.5281/zenodo.14587026"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
